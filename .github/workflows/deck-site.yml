name: Deck site checks

on:
  push:
    paths:
      - "apps/deck-site/**"
      - ".github/workflows/deck-site.yml"
  pull_request:
    paths:
      - "apps/deck-site/**"
      - ".github/workflows/deck-site.yml"

jobs:
  deck-site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/deck-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/deck-site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
